#------------------------------------------------------------------------------
# pgpool-II configuration for RSHD Lab 3
# - 3 backend nodes: pg-a (primary), pg-b (sync replica), pg-c (async replica)
# - Streaming replication clustering mode, load balancing, automatic failover
#------------------------------------------------------------------------------

# - CONNECTIONS -
listen_addresses = '*'
port = 9999
socket_dir = '/var/run/postgresql'
pcp_listen_addresses = '*'
pcp_port = 9898
pcp_socket_dir = '/var/run/postgresql'

# - POOLING -
num_init_children = 32
max_pool = 4
child_life_time = 300
child_max_connections = 0
connection_life_time = 0
client_idle_limit = 0

# - LOGGING -
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%t: pid %p: '
log_connections = on
log_hostname = on
log_statement = off
log_per_node_statement = on
log_standby_delay = 'always'

# - PID / SOCKET FILES -
pid_file_name = '/var/run/pgpool/pgpool.pid'
logdir = '/var/log/pgpool'

# - BACKEND CONNECTIONS -
backend_hostname0 = 'pg-a'
backend_port0 = 5432
backend_weight0 = 1
backend_data_directory0 = '/var/lib/postgresql/data'
backend_flag0 = 'ALLOW_TO_FAILOVER'
backend_application_name0 = 'pg-a-primary'

backend_hostname1 = 'pg-b'
backend_port1 = 5432
backend_weight1 = 1
backend_data_directory1 = '/var/lib/postgresql/data'
backend_flag1 = 'ALLOW_TO_FAILOVER'
backend_application_name1 = 'pg-b-sync'

backend_hostname2 = 'pg-c'
backend_port2 = 5432
backend_weight2 = 1
backend_data_directory2 = '/var/lib/postgresql/data'
backend_flag2 = 'ALLOW_TO_FAILOVER'
backend_application_name2 = 'pg-c-async'

# - AUTHENTICATION -
enable_pool_hba = on
pool_passwd = 'pool_passwd'
authentication_timeout = 60

# - REPLICATION / CLUSTERING -
backend_clustering_mode = 'streaming_replication'
load_balance_mode = on
statement_level_load_balance = off
master_slave_mode = on
master_slave_sub_mode = 'stream'

# - STREAMING REPLICATION CHECK -
sr_check_period = 5
sr_check_user = 'replicator'
sr_check_password = 'replpass'
sr_check_database = 'postgres'
delay_threshold = 10000000

# - HEALTH CHECK -
health_check_period = 5
health_check_timeout = 10
health_check_user = 'postgres'
health_check_password = 'postgres'
health_check_database = 'postgres'
health_check_max_retries = 3
health_check_retry_delay = 1
connect_timeout = 10000

# - FAILOVER -
failover_command = '/scripts/failover.sh %d "%h" %p "%D" %m "%H" %M %P %r "%R"'
failback_command = ''
failover_on_backend_error = on
search_primary_node_timeout = 30

# - ONLINE RECOVERY -
recovery_user = 'postgres'
recovery_password = 'postgres'
recovery_1st_stage_command = ''
recovery_2nd_stage_command = ''

# - OTHER -
ssl = off
relcache_expire = 0
relcache_size = 256
