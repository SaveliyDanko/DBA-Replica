services:
  pg-a:
    build:
      context: ./postgres
    image: rshd-lab3-postgres:latest
    container_name: pg-a
    hostname: pg-a
    environment:
      NODE_ROLE: primary
      NODE_APPNAME: pg-a-primary
      POSTGRES_PASSWORD: postgres
      REPL_USER: replicator
      REPL_PASSWORD: replpass
      SYNC_STANDBY_NAMES: "pg-b-sync"
    volumes:
      - pg-a-data:/var/lib/postgresql/data
    networks:
      pgnet:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  pg-b:
    build:
      context: ./postgres
    image: rshd-lab3-postgres:latest
    container_name: pg-b
    hostname: pg-b
    environment:
      NODE_ROLE: standby
      NODE_APPNAME: pg-b-sync
      PRIMARY_HOST: pg-a
      POSTGRES_PASSWORD: postgres
      REPL_USER: replicator
      REPL_PASSWORD: replpass
    depends_on:
      pg-a:
        condition: service_healthy
    volumes:
      - pg-b-data:/var/lib/postgresql/data
    networks:
      pgnet:
        ipv4_address: 172.28.0.11
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  pg-c:
    build:
      context: ./postgres
    image: rshd-lab3-postgres:latest
    container_name: pg-c
    hostname: pg-c
    environment:
      NODE_ROLE: standby
      NODE_APPNAME: pg-c-async
      PRIMARY_HOST: pg-a
      POSTGRES_PASSWORD: postgres
      REPL_USER: replicator
      REPL_PASSWORD: replpass
    depends_on:
      pg-a:
        condition: service_healthy
    volumes:
      - pg-c-data:/var/lib/postgresql/data
    networks:
      pgnet:
        ipv4_address: 172.28.0.12
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgpool:
    build:
      context: ./pgpool
    image: rshd-lab3-pgpool:latest
    container_name: pgpool
    hostname: pgpool
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REPL_USER: replicator
      REPL_PASSWORD: replpass
    depends_on:
      pg-a:
        condition: service_healthy
      pg-b:
        condition: service_healthy
      pg-c:
        condition: service_healthy
    ports:
      - "9999:9999"
    networks:
      pgnet:
        ipv4_address: 172.28.0.20

  client:
    image: postgres:16
    container_name: pg-client
    hostname: pg-client
    environment:
      PGPASSWORD: postgres
    networks:
      pgnet:
        ipv4_address: 172.28.0.30
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      - pgpool

volumes:
  pg-a-data:
  pg-b-data:
  pg-c-data:

networks:
  pgnet:
    name: rshd-lab3-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
